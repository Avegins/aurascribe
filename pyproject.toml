[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurascribe"
version = "0.1.0"
description = "AI-powered clinical audio transcription and structured documentation (SOAP) MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "opentelemetry-api>=1.28.0,<1.40.0",
    "pydantic-ai-slim[openai]>=0.0.14",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:opentelemetry.*",
    "ignore::DeprecationWarning:pydantic_ai.*",
]
