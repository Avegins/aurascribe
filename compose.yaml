services:
  aurascribe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurascribe-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - AURASCRIBE_ENV=${AURASCRIBE_ENV:-development}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AURASCRIBE_TRANSCRIPTION_MODEL=${AURASCRIBE_TRANSCRIPTION_MODEL:-whisper-1}
      - AURASCRIBE_LLM_MODEL=${AURASCRIBE_LLM_MODEL:-gpt-4o-mini}
      - AURASCRIBE_MAX_AUDIO_SIZE_BYTES=${AURASCRIBE_MAX_AUDIO_SIZE_BYTES:-26214400}
      - AURASCRIBE_REQUEST_TIMEOUT_SECONDS=${AURASCRIBE_REQUEST_TIMEOUT_SECONDS:-60}
      - AURASCRIBE_AGENT_RETRY_LIMIT=${AURASCRIBE_AGENT_RETRY_LIMIT:-2}
      - AURASCRIBE_LOG_LEVEL=${AURASCRIBE_LOG_LEVEL:-INFO}
      - AURASCRIBE_PROMPT_VERSION=${AURASCRIBE_PROMPT_VERSION:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

